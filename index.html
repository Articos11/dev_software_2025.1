<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ResumeAI</h1>
<form action="#" method="post" enctype="multipart/form-data"> <!-- tem que mudar o action depois pra /upload-pdf" com isso ele manda pra rota da api-->
            <div class="form-group">
                <label for="prompt">Seu Prompt:</label>
                <textarea id="prompt" name="prompt" placeholder="Você gostaria de algo mais específico no resumo?"></textarea>
            </div>
            <div class="form-group">
                <label for="pdf_file">Upload do Arquivo (PDF):</label>
                <input type="file" id="pdf_file" name="pdf_file" accept=".pdf">
            </div>
            <input type="submit" value="Gerar resumo">
        </form>
    </div>
</body>
</html>
